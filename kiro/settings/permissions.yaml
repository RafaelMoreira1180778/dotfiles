rules:
  - capability: shell
    effect: deny
    match:
      - rm -rf /*
      - rm -rf ~*
      - sudo *
      - chmod 777*
      - chmod -R 777*
      - mkfs*
      - dd * of=/dev/*
      - shutdown*
      - reboot*
      - git push --force*
      - git push -f*
      - git push * --force*
      - "* --no-verify"
  - capability: shell
    effect: ask
    match:
      - git push*
      - npm publish*
      - docker push*
      - gh pr merge*
      - gh release*
  - capability: shell
    effect: ask
    match:
      - curl * -d*
      - curl * --data*
      - curl * -F*
      - curl * -T*
      - curl * -X POST*
      - curl * -X PUT*
      - wget * --post*
  - capability: shell
    effect: ask
    match:
      - terraform init*
      - terraform apply*
      - terraform destroy*
  - capability: shell
    effect: ask
    match:
      - aws * create-*
      - aws * delete-*
      - aws * put-*
      - aws * update-*
      - aws * modify-*
      - aws * attach-*
      - aws * detach-*
      - aws * terminate-*
      - aws * start-*
      - aws * stop-*
      - aws iam *
  - capability: fs_write
    effect: ask
    match:
      - .github/workflows/**
      - "**/Dockerfile"
      - "**/*.lock"
  - capability: fs_read
    effect: allow
  - capability: fs_write
    effect: allow
  - capability: shell
    effect: allow
  - capability: web_search
    effect: allow
  - capability: web_fetch
    effect: allow
  - capability: mcp
    effect: allow
  - capability: power
    effect: allow
