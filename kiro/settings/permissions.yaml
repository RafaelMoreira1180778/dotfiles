rules:
  # Dangerous shell commands
  - capability: shell
    effect: deny
    match:
      - "rm -rf /*"
      - "rm -rf ~*"
      - "sudo *"
      - "chmod 777*"
      - "chmod -R 777*"
      - "mkfs*"
      - "dd * of=/dev/*"
      - "shutdown*"
      - "reboot*"
      - "git push --force*"
      - "git push -f*"
      - "git push * --force*"
      - "* --no-verify"

  # Publishing and shared state
  - capability: shell
    effect: ask
    match:
      - "git push*"
      - "npm publish*"
      - "docker push*"
      - "gh pr merge*"
      - "gh release*"

  # Data exfiltration guard
  - capability: shell
    effect: ask
    match:
      - "curl * -d*"
      - "curl * --data*"
      - "curl * -F*"
      - "curl * -T*"
      - "curl * -X POST*"
      - "curl * -X PUT*"
      - "wget * --post*"

  # IaC lifecycle
  - capability: shell
    effect: ask
    match:
      - "terraform init*"
      - "terraform apply*"
      - "terraform destroy*"

  # AWS mutating operations
  - capability: shell
    effect: ask
    match:
      - "aws * create-*"
      - "aws * delete-*"
      - "aws * put-*"
      - "aws * update-*"
      - "aws * modify-*"
      - "aws * attach-*"
      - "aws * detach-*"
      - "aws * terminate-*"
      - "aws * start-*"
      - "aws * stop-*"
      - "aws iam *"

  # Supply-chain-sensitive files
  - capability: fs_write
    effect: ask
    match:
      - ".github/workflows/**"
      - "**/Dockerfile"
      - "**/*.lock"

  - capability: fs_read
    effect: allow

  - capability: fs_write
    effect: allow
    match:
      - "./**"

  - capability: shell
    effect: allow

  - capability: web_search
    effect: allow

  - capability: web_fetch
    effect: allow

  - capability: mcp
    effect: allow
